server.port=8080
spring.application.name=art-gallery-management-system

# Default local run uses H2 for easy testing in this environment.
# To run with PostgreSQL instead, replace the URL with your local PostgreSQL database.
spring.datasource.url=jdbc:h2:mem:artgallery;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
